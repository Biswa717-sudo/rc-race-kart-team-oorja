<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 850" width="100%" height="100%" style="background:#0b0e14; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="kartTube" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d4450" />
      <stop offset="50%" stop-color="#1e222b" />
      <stop offset="100%" stop-color="#12151b" />
    </linearGradient>
    <linearGradient id="seatGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2e37" />
      <stop offset="50%" stop-color="#181a20" />
      <stop offset="100%" stop-color="#0e1014" />
    </linearGradient>
    <linearGradient id="metalSilver" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cfd7e6" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#9aa5b5" />
    </linearGradient>
    <linearGradient id="anodizedRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff3b30" />
      <stop offset="100%" stop-color="#99140e" />
    </linearGradient>
    <linearGradient id="tireWide" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2d3139" />
      <stop offset="50%" stop-color="#444a56" />
      <stop offset="100%" stop-color="#1a1c22" />
    </linearGradient>

    <!-- Filters -->
    <filter id="kartShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="3" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Background Grid -->
  <g opacity="0.06" stroke="#00e5ff" stroke-width="1">
    <pattern id="kartGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none"/>
    </pattern>
    <rect width="1000" height="850" fill="url(#kartGrid)" />
  </g>

  <!-- Title Banner -->
  <g transform="translate(50, 40)">
    <text x="0" y="0" fill="#00e5ff" font-size="24" font-weight="800" letter-spacing="1.5">AUTHENTIC COMPETITION GO-KART (1/10 RWD)</text>
    <text x="0" y="24" fill="#8b949e" font-size="13">Side-Mounted RS-540 • Left Battery Counterbalance • Solid 8mm Live Axle • Pure Chassis Flex Dynamics</text>
  </g>

  <!-- KART TOP-DOWN ASSEMBLY (Centered) -->
  <g transform="translate(100, 110)">

    <!-- 1. TUBULAR PERIMETER CHASSIS & NERF BARS -->
    <!-- Side Nerf Bars (Left & Right) -->
    <g id="nerf-bars" stroke="#ff3b30" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#kartShadow)">
      <!-- Left Nerf Bar (Protects Battery) -->
      <path d="M 230 140 L 480 130 L 530 160 L 530 200 L 230 200 Z" stroke-width="6"/>
      <!-- Right Nerf Bar (Protects Motor) -->
      <path d="M 230 460 L 480 470 L 530 440 L 530 400 L 230 400 Z" stroke-width="6"/>
    </g>

    <!-- Front Bumper Loop (Curved Plastic/Tubular) -->
    <path d="M 80 200 C 30 240, 30 360, 80 400 L 120 400 L 120 200 Z" 
          fill="#161b22" stroke="#ff3b30" stroke-width="5" filter="url(#kartShadow)" rx="6"/>

    <!-- Main Chassis Tubes (Twin Parallel Rails with Waist Bend) -->
    <g id="main-tubes" stroke="url(#kartTube)" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#kartShadow)">
      <!-- Left Chassis Rail -->
      <path d="M 100 240 L 220 240 L 300 210 L 580 210 L 640 210"/>
      <!-- Right Chassis Rail -->
      <path d="M 100 360 L 220 360 L 300 390 L 580 390 L 640 390"/>
      <!-- Front Crossmember -->
      <line x1="120" y1="240" x2="120" y2="360" stroke-width="8"/>
      <!-- Waist Crossmember (Under Seat) -->
      <line x1="320" y1="210" x2="320" y2="390" stroke-width="8"/>
      <!-- Rear Axle Crossmember -->
      <line x1="580" y1="210" x2="580" y2="390" stroke-width="8"/>
    </g>

    <!-- Rear Axle Bumper Loop -->
    <path d="M 620 180 L 720 180 L 720 420 L 620 420" 
          fill="none" stroke="#ff3b30" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#kartShadow)"/>

    <!-- Floor Pan (Thin Aluminum / Carbon Sheet between front rails) -->
    <path d="M 100 240 L 280 240 L 310 215 L 310 385 L 280 360 L 100 360 Z" 
          fill="#1c2128" stroke="#30363d" stroke-width="1.5"/>

    <!-- 2. FRONT END & DIRECT STEERING -->
    <!-- Front C-Hubs & Kingpins (With 12° Caster for Authentic Kart Jacking) -->
    <g id="front-knuckles">
      <!-- Left Front Knuckle & Stub Axle -->
      <rect x="110" y="160" width="22" height="30" rx="3" fill="url(#metalSilver)" stroke="#111" filter="url(#kartShadow)"/>
      <line x1="121" y1="130" x2="121" y2="190" stroke="#00e5ff" stroke-width="2.5"/> <!-- Kingpin Axis -->

      <!-- Right Front Knuckle & Stub Axle -->
      <rect x="110" y="410" width="22" height="30" rx="3" fill="url(#metalSilver)" stroke="#111" filter="url(#kartShadow)"/>
      <line x1="121" y1="410" x2="121" y2="470" stroke="#00e5ff" stroke-width="2.5"/> <!-- Kingpin Axis -->

      <!-- Front Wheels (Narrower Front Slicks: 26mm wide, 65mm OD) -->
      <!-- Left Front Wheel -->
      <g filter="url(#kartShadow)">
        <rect x="90" y="105" width="65" height="45" rx="6" fill="url(#tireWide)" stroke="#111" stroke-width="1.5"/>
        <circle cx="122.5" cy="127.5" r="12" fill="#ff3b30"/>
        <circle cx="122.5" cy="127.5" r="4" fill="#ffffff"/>
      </g>
      <!-- Right Front Wheel -->
      <g filter="url(#kartShadow)">
        <rect x="90" y="450" width="65" height="45" rx="6" fill="url(#tireWide)" stroke="#111" stroke-width="1.5"/>
        <circle cx="122.5" cy="472.5" r="12" fill="#ff3b30"/>
        <circle cx="122.5" cy="472.5" r="4" fill="#ffffff"/>
      </g>

      <!-- Steering Column (Angled) & Tie Rods -->
      <g id="steering-assembly">
        <!-- Steering Servo (Concealed under Nassau panel) -->
        <rect x="175" y="275" width="45" height="50" rx="3" fill="#161b22" stroke="#00e5ff" stroke-width="1.5"/>
        <circle cx="210" cy="300" r="7" fill="#00e5ff"/>
        <!-- Tie Rods (Direct to Knuckles) -->
        <line x1="210" y1="295" x2="125" y2="185" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
        <line x1="210" y1="305" x2="125" y2="415" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
        <circle cx="125" cy="185" r="4" fill="#ff3b30"/>
        <circle cx="125" cy="415" r="4" fill="#ff3b30"/>
        
        <!-- Nassau Front Fairing / Number Plate -->
        <path d="M 140 270 L 220 280 L 220 320 L 140 330 Z" fill="#ff3b30" rx="4" filter="url(#kartShadow)"/>
        <text x="175" y="306" fill="#ffffff" font-size="14" font-weight="900" text-anchor="middle">#1</text>
        
        <!-- Butterfly Kart Steering Wheel -->
        <path d="M 235 285 C 245 285, 245 315, 235 315 L 248 318 C 255 312, 255 288, 248 282 Z" 
              fill="#222" stroke="#555" stroke-width="2" filter="url(#kartShadow)"/>
      </g>
    </g>

    <!-- 3. CENTRAL KART RACING BUCKET SEAT -->
    <!-- Molded Deep Bucket Seat (Fiberglass Style) -->
    <g id="racing-seat" filter="url(#kartShadow)">
      <path d="M 330 250 
               C 320 230, 390 230, 440 240 
               C 470 250, 480 270, 480 300 
               C 480 330, 470 350, 440 360 
               C 390 370, 320 370, 330 350 
               C 340 330, 345 315, 345 300 
               C 345 285, 340 270, 330 250 Z" 
            fill="url(#seatGrad)" stroke="#ff3b30" stroke-width="2.5"/>
      <ellipse cx="400" cy="300" rx="35" ry="25" fill="#12151b" opacity="0.8"/>
      <text x="390" y="305" fill="#58a6ff" font-size="11" font-weight="700">KART SEAT</text>
    </g>

    <!-- 4. SIDE-BY-SIDE POWER & BALANCE (THE TRUE KART LAYOUT) -->
    
    <!-- LEFT SIDE: 2S LiPo Battery (Balances Motor Weight!) -->
    <g id="left-battery" filter="url(#kartShadow)" transform="translate(340, 145)">
      <rect x="0" y="0" width="135" height="50" rx="4" fill="#00e5ff" stroke="#ffffff" stroke-width="1.5"/>
      <text x="12" y="28" fill="#0b0e14" font-size="11" font-weight="800">2S LiPo (8.4V Max)</text>
      <text x="12" y="42" fill="#0b0e14" font-size="9" font-weight="600">Left Weight Balance</text>
      <!-- Battery Hold-down Brackets -->
      <rect x="25" y="-4" width="10" height="58" fill="#ff3b30"/>
      <rect x="100" y="-4" width="10" height="58" fill="#ff3b30"/>
    </g>

    <!-- RIGHT SIDE: RS-540 Brushed Motor (Inboard of Right Rear Wheel) -->
    <g id="right-motor" filter="url(#kartShadow)" transform="translate(390, 405)">
      <!-- Motor Clamp Mount -->
      <rect x="-10" y="-8" width="85" height="58" rx="4" fill="#1c2128" stroke="#30363d"/>
      <!-- RS-540 Can -->
      <rect x="0" y="0" width="65" height="42" rx="6" fill="url(#metalSilver)" stroke="#111" stroke-width="1.5"/>
      <!-- Motor Vents -->
      <rect x="10" y="8" width="6" height="26" rx="2" fill="#21262d"/>
      <rect x="22" y="8" width="6" height="26" rx="2" fill="#21262d"/>
      <text x="8" y="26" fill="#111" font-size="12" font-weight="800">RS-540</text>
      <!-- Shaft & Pinion (Facing Rear Axle) -->
      <rect x="65" y="17" width="16" height="8" fill="#f2cc60" stroke="#111"/>
    </g>

    <!-- ESC & Receiver (Under / Behind Seat) -->
    <g id="electronics-pod" transform="translate(485, 275)" filter="url(#kartShadow)">
      <!-- Hobbywing 1060 ESC -->
      <rect x="0" y="0" width="50" height="50" rx="3" fill="#da3633" stroke="#f85149" stroke-width="1.5"/>
      <text x="10" y="28" fill="#ffffff" font-size="10" font-weight="800">1060</text>
      <text x="12" y="40" fill="#ffffff" font-size="8">ESC</text>
    </g>

    <!-- 5. REAR SOLID LIVE AXLE & FAT KART TIRES -->
    <!-- 8mm Continuous Precision Ground Steel Live Axle -->
    <rect x="635" y="75" width="10" height="450" rx="4" fill="url(#metalSilver)" stroke="#111" stroke-width="2" filter="url(#kartShadow)"/>

    <!-- Left Anodized Pillow Block Bearing Cassette -->
    <g transform="translate(625, 195)" filter="url(#kartShadow)">
      <rect x="0" y="0" width="30" height="32" rx="4" fill="url(#anodizedRed)" stroke="#30363d"/>
      <circle cx="15" cy="16" r="8" fill="#222" stroke="#f2cc60" stroke-width="2"/>
    </g>

    <!-- Right Anodized Pillow Block Bearing Cassette -->
    <g transform="translate(625, 375)" filter="url(#kartShadow)">
      <rect x="0" y="0" width="30" height="32" rx="4" fill="url(#anodizedRed)" stroke="#30363d"/>
      <circle cx="15" cy="16" r="8" fill="#222" stroke="#f2cc60" stroke-width="2"/>
    </g>

    <!-- Inboard Drivetrain: Motor to Axle Spur / Belt -->
    <!-- Large Axle Spur Gear (Locked to Axle next to Right Bearing) -->
    <circle cx="640" cy="426" r="28" fill="#ff3b30" stroke="#ffffff" stroke-width="2" stroke-dasharray="4 2" filter="url(#kartShadow)"/>
    <circle cx="640" cy="426" r="8" fill="#161b22"/>
    <!-- Drive Chain / Belt connecting Motor Pinion to Axle Gear -->
    <path d="M 470 422 L 640 400 L 640 452 L 470 430 Z" fill="none" stroke="#f2cc60" stroke-width="4" stroke-dasharray="3 1.5"/>

    <!-- Left & Right Wide Rear Kart Tires (Fat 38mm wide, 65mm OD) -->
    <!-- Rear Left Tire -->
    <g filter="url(#kartShadow)">
      <rect x="600" y="55" width="80" height="55" rx="6" fill="url(#tireWide)" stroke="#111" stroke-width="2"/>
      <rect x="618" y="68" width="44" height="30" rx="3" fill="#ff3b30"/>
      <circle cx="640" cy="83" r="6" fill="#ffffff"/> <!-- Axle Lock Nut -->
    </g>
    <!-- Rear Right Tire -->
    <g filter="url(#kartShadow)">
      <rect x="600" y="490" width="80" height="55" rx="6" fill="url(#tireWide)" stroke="#111" stroke-width="2"/>
      <rect x="618" y="503" width="44" height="30" rx="3" fill="#ff3b30"/>
      <circle cx="640" cy="518" r="6" fill="#ffffff"/> <!-- Axle Lock Nut -->
    </g>

  </g>

  <!-- LABELS & CALLOUTS -->
  <g transform="translate(0, 0)">
    <!-- Callout: Side-Mounted Motor -->
    <path d="M 720 590 L 580 590 L 510 540" fill="none" stroke="#f2cc60" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text x="730" y="594" fill="#f2cc60" font-size="12" font-weight="700">SIDE-MOUNTED RS-540 (REAL KART POSITION)</text>

    <!-- Callout: Battery Balance -->
    <path d="M 260 210 L 380 210 L 410 240" fill="none" stroke="#00e5ff" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text x="100" y="205" fill="#00e5ff" font-size="12" font-weight="700">LEFT BATTERY (50/50 CROSS-WEIGHT)</text>

    <!-- Callout: Bucket Seat -->
    <path d="M 720 380 L 540 380 L 490 410" fill="none" stroke="#ff3b30" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text x="730" y="384" fill="#ff3b30" font-size="12" font-weight="700">DEEP RACING BUCKET SEAT</text>

    <!-- Callout: Solid Axle -->
    <path d="M 780 260 L 750 260 L 745 220" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text x="790" y="264" fill="#ffffff" font-size="12" font-weight="700">8mm SOLID LIVE AXLE (SPOOL)</text>

    <!-- Dimension Banner -->
    <g transform="translate(100, 770)" fill="#8b949e" font-size="12">
      <line x1="122" y1="0" x2="640" y2="0" stroke="#8b949e" stroke-width="1.5"/>
      <circle cx="122" cy="0" r="3" fill="#00e5ff"/>
      <circle cx="640" cy="0" r="3" fill="#00e5ff"/>
      <text x="320" y="-8" fill="#00e5ff" font-weight="700">WHEELBASE: 250 mm</text>

      <line x1="750" y1="-660" x2="750" y2="-220" stroke="#8b949e" stroke-width="1.5"/>
      <circle cx="750" cy="-660" r="3" fill="#00e5ff"/>
      <circle cx="750" cy="-220" r="3" fill="#00e5ff"/>
      <text x="760" y="-440" fill="#00e5ff" font-weight="700" transform="rotate(90 760 -440)">REAR TRACK WIDTH: 185 mm</text>
    </g>
  </g>
</svg>
